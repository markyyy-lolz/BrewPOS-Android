name: BrewPOS Live Endpoint Smoke

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/live-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-and-auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public website responds with BrewPOS content
        run: |
          set -euo pipefail
          site='https://rfxzbuocxersgbshczbj.supabase.co/functions/v1/brewpos-site/'
          code=$(curl -sS -L -o /tmp/brewpos-home.html -w '%{http_code}' --max-time 25 "$site")
          test "$code" = "200"
          grep -q 'BrewPOS' /tmp/brewpos-home.html
          css=$(curl -sS -L -o /tmp/brewpos-styles.css -w '%{http_code}' --max-time 25 "${site}styles.css")
          test "$css" = "200"
          grep -q 'hero-grid' /tmp/brewpos-styles.css
      - name: Unauthenticated cloud sync must be rejected
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/brewpos-sync-denied.json -w '%{http_code}' --max-time 25             -X POST 'https://rfxzbuocxersgbshczbj.supabase.co/functions/v1/brewpos-sync'             -H 'content-type: application/json'             -d '{"action":"whoami"}')
          test "$code" = "401"
          grep -qi 'sign in' /tmp/brewpos-sync-denied.json
