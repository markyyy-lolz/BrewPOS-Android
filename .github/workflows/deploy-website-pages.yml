name: Deploy BrewPOS Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "brewpos-github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Verify only website files are published
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/dashboard.html
          test -f website/dashboard.js
          test -f website/styles.css
          if grep -REn 'service_role|sb_secret_' website --exclude='README.md'; then
            echo "Refusing to publish possible server credentials"
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public website directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
