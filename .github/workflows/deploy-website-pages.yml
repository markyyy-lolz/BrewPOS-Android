name: Validate BrewPOS Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website-pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "supabase/functions/brewpos-owner/**"
      - ".github/workflows/deploy-website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-tests:
    name: Validate public website and inquiry API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check website syntax and tests
        working-directory: website
        run: npm run check
      - name: Verify deployed owner console and unauthenticated denial
        run: |
          set -euo pipefail
          site='https://rfxzbuocxersgbshczbj.supabase.co/functions/v1/brewpos-site'
          owner='https://rfxzbuocxersgbshczbj.supabase.co/functions/v1/brewpos-owner'
          for file in owner.html owner.css owner.js; do
            code=$(curl -fsSL -o "/tmp/brewpos-$file" -w '%{http_code}' --max-time 25 "$site/$file")
            test "$code" = "200"
          done
          grep -q 'Azurate Owner Console' /tmp/brewpos-owner.html
          grep -q 'auth-screen' /tmp/brewpos-owner.css
          grep -q 'functions/v1/brewpos-owner' /tmp/brewpos-owner.js
          # No owner account is provisioned yet: unauthenticated requests must never obtain owner data.
          code=$(curl -sSL -o /tmp/brewpos-owner-denied.json -w '%{http_code}' --max-time 25 \
            -X POST "$owner" -H 'content-type: application/json' -d '{"action":"overview"}')
          test "$code" = "401" -o "$code" = "403" -o "$code" = "503"
      - name: Confirm static publishing files
        run: |
          test -f website/public/index.html
          test -f website/public/styles.css
          test -f website/public/privacy.html
          test -f website/public/terms.html
          grep -q "Offline Basic" website/public/index.html
          grep -q "Offline Premium" website/public/index.html

# GitHub Pages itself deploys the gh-pages branch automatically.
# Do not run an additional Pages Actions deployment from main.
