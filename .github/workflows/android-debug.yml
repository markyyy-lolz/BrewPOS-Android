name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test BrewPOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      # The current source does not bundle official gradlew scripts/jar.
      # Use the pinned Gradle distribution in CI instead of a non-existent wrapper.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-v2.0-ui-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish activation preview prerelease (DEBUG APK only)
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0-ui-foundation-preview >/dev/null 2>&1 || gh release create v2.0.0-ui-foundation-preview --prerelease --title "BrewPOS v2.0 UI Foundation (DEBUG)" --notes "Modern dashboard, tablet sidebar, and redesigned activation. Offline UI preview only, no Supabase Hybrid sync yet. Hardware testing required."
          gh release upload v2.0.0-ui-foundation-preview app/build/outputs/apk/debug/app-debug.apk --clobber
