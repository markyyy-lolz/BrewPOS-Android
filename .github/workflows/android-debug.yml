name: Android Debug APK

on:
  push:
    branches: [main, feature/android-kiosk-qrph-multiprinter, feature/android-premium-ui-refresh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test BrewPOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      # The current source does not bundle official gradlew scripts/jar.
      # Use the pinned Gradle distribution in CI instead of a non-existent wrapper.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :kiosk:assembleDebug

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-v2.0-hybrid-alpha-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android self-ordering kiosk debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-SelfOrdering-Android-Kiosk-DEV-APK
          path: kiosk/build/outputs/apk/debug/kiosk-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish premium Android UI DEVELOPMENT preview
        if: success() && github.ref == 'refs/heads/feature/android-premium-ui-refresh' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.2.0-kiosk-reference-design-preview.1
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BrewPOS-Android-Cashier-PremiumUI-DEV.apk
          cp kiosk/build/outputs/apk/debug/kiosk-debug.apk dist/BrewPOS-Android-Kiosk-PremiumUI-DEV.apk
          cat > /tmp/brewpos-premium-notes.md <<'NOTES'
          ## BrewPOS v2.2 — Photo-based Self Order Kiosk (Android development preview)
          
          ## New kiosk interface
          - Rebuilt customer home to closely follow the approved BrewPOS visual reference.
          - Large coffee photo hero, premium dine-in/takeout cards, live category chips and photo-based menu product cards.
          - Always-visible order summary, Pay at Cashier, and server-gated QR Ph TEST (never silently enabled).
          - Original manager pairing, product quantities, customization, authenticated checkout and order-number confirmation remain.
          - Photos are illustrative Unsplash CDN placeholders; names, stock and prices always come from the café's real branch database.
          - Product catalog must be populated by café owner; no mock products are inserted.
          
          Both Android apps retain the existing user and checkout architecture from PR #13:
          - **Two Android cashier access modes:** Offline POS with genuine BP1 device key, or Cloud POS using approved email account and verified active plan, independent of offline license.
          - **Cloud authentication:** Password or email verification code. Unapproved café users can request access directly in app; owner reviews in the live website Client Approvals tab.
          - **Android Settings:** Account mode, pending sync status, local receipts, three printer tests, printer assignment and cloud sync.
          - **Live owner dashboard:** Approve/reject cloud accounts, assign trial/monthly/lifetime plan, suspend/reactivate, issue offline licenses separately.
          - **Safety:** Cloud checkout is blocked without recent server confirmation and registered branch. Offline key is still required for disconnected selling.
          - Cashier: café sidebar, adaptive landscape dual-pane checkout, polished catalog, quantity controls and branded cart.
          - Kiosk: premium manager pairing, welcome screen, dine-in/takeout selector, menu category chips, product cards and cart flow.
          
          - **Self-order kiosk:** Fixed Android system status bar overlap; friendly empty-menu state; automatically refreshes cloud catalog while waiting for the café menu.
          - **Menu management:** Azurate Owner Dashboard now includes branch-scoped real menu product creation/editing. Enter actual café items and prices; no sample menu is seeded.

          **Technical preview, not production checkout certification.** Kiosk backend tables and authenticated Edge API are active, but pairing and ordering require an approved café organization, branch, device registration and real menu. QR Ph payment processing is not live. Cloud accounts require internet to authorize checkout; offline license mode remains the supported offline sales workflow. Android cashier offline SQLite ordering and branch inventory logic are inherited from existing development work. Real product photos require approved image assets and menu image metadata; cards currently use category illustrations. Do not claim live payment verification, cloud kiosk operation or physical printer acceptance.
          
          DEBUG-SIGNED TEST APKs ONLY. Install on a non-production tablet. Back up existing cashier local receipts and stock records before installation; do not clear app data. For the black Overlay #1 bar seen in screenshots, disable Android Developer Options > Simulate secondary displays > None.
          
          Owner signing remains in Supabase Vault. Customer plans are verified by the authenticated server, not a local flag. This debug APK trusts the updated public key and older valid BP1 signatures. **Do not wipe Android app data or install over a productive device without backing up offline sales.**\n          \n          Source: feature/android-premium-ui-refresh, PR #13. Details: docs/ANDROID_PREMIUM_UI_REFRESH.md.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
              --title "BrewPOS Android v2.2 — Premium Coffee Kiosk UI Preview" \
              --notes-file /tmp/brewpos-premium-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/BrewPOS-Android-Cashier-PremiumUI-DEV.apk \
            dist/BrewPOS-Android-Kiosk-PremiumUI-DEV.apk --clobber

      - name: Publish Android cashier + kiosk DEVELOPMENT pre-release
        if: success() && github.ref == 'refs/heads/feature/android-kiosk-qrph-multiprinter' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.0.0-android-self-order-preview.1
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BrewPOS-Android-Cashier-DEV.apk
          cp kiosk/build/outputs/apk/debug/kiosk-debug.apk dist/BrewPOS-Android-SelfOrdering-Kiosk-DEV.apk
          cat > /tmp/brewpos-kiosk-release.md <<'NOTES'
          ## BrewPOS Android Cashier + Self-Ordering Kiosk — DEVELOPMENT PREVIEW
          
          **Android only:** two independent debug APKs, cashier and touchscreen self-order kiosk.
          
          Features in source: menu and drink customization, dine-in/takeout, Pay at Cashier or QR Ph selection, order-number flow, kiosk-order cashier UI, and separate Bluetooth printer routing for customer, barista and kitchen tickets.
          
          **Not a production launch.** The kiosk Supabase SQL migration and dedicated `brewpos-kiosk` Edge Function are deliberately NOT deployed. Kiosk pairing, synchronized unpaid orders, cashier settlement and QR Ph cannot be used on the live café backend until the reviewed migration and authenticated endpoint have been deployed and tested.
          
          QR Ph is **test-mode only and disabled by default** without test-merchant credentials. It must never be treated as a confirmed payment based on a displayed QR. No live QR Ph payment, merchant onboarding, webhook/expiry acceptance, or physical printer testing is claimed. Android kiosk orders require network connectivity; offline LAN hub is not implemented.
          
          The cashier retains its existing SQLite offline checkout, BP1 device activation and hybrid sync mechanics; no database was reset. APKs are **debug-signed** for technical evaluation and require device/branch onboarding where applicable. Do not install over a deployed production app without verified local backups. Avoid clearing Android app data.
          
          Source: feature/android-kiosk-qrph-multiprinter; draft PR #12. Full setup and blockers: docs/ANDROID_SELF_ORDER_KIOSK.md.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Development pre-release already exists; refresh attached build files."
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
              --title "BrewPOS Android Cashier + Self-Order Kiosk — Development Preview 1" \
              --notes-file /tmp/brewpos-kiosk-release.md
          fi
          gh release upload "$RELEASE_TAG" dist/BrewPOS-Android-Cashier-DEV.apk \
            dist/BrewPOS-Android-SelfOrdering-Kiosk-DEV.apk --clobber

      - name: Publish activation preview prerelease (DEBUG APK only)
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0-hybrid-alpha >/dev/null 2>&1 || gh release create v2.0.0-hybrid-alpha --prerelease --title "BrewPOS v2.0 Hybrid Alpha (DEBUG)" --notes "Cloud sync endpoint integration, encrypted staff session, local outbox and retry support. Requires provisioned staff access and tablet registration. DEBUG alpha only; no production hardware/backup validation."
          gh release upload v2.0.0-hybrid-alpha app/build/outputs/apk/debug/app-debug.apk --clobber
