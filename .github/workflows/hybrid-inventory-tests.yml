name: Hybrid inventory contracts
on:
  push:
    branches: [feature/cafe-oabi-windows-hybrid-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  database-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci --prefix supabase/tests
      - run: node --test supabase/tests/*.test.mjs
