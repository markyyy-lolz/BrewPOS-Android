name: Import BrewPOS Source
on:
  push:
    branches: [main]
    paths: ['.source-import/ready.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and import BrewPOS source
        run: |
          set -euo pipefail
          cat .source-import/part-*.txt | base64 -d >/tmp/BrewPOS-source-v1.1.tar.xz
          echo 'd9e348d2a1094e0222dec6106f3ad732790e7a5cc8ec57bbedd7c47dedb8d1d8  /tmp/BrewPOS-source-v1.1.tar.xz' | sha256sum -c -
          tar -xJf /tmp/BrewPOS-source-v1.1.tar.xz -C .
          rm -rf .source-import
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import BrewPOS v1.1 Android project'
          git push origin HEAD:main
