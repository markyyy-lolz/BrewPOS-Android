name: Import BrewPOS Source
on:
  push:
    branches: [main]
    paths: ['BrewPOS-source-v1.1.tar.xz']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract BrewPOS source
        run: |
          test -s BrewPOS-source-v1.1.tar.xz
          tar -xJf BrewPOS-source-v1.1.tar.xz -C .
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import BrewPOS v1.1 Android source' || exit 0
          git push origin HEAD:main
