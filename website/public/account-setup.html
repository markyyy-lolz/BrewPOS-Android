<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#153f37">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://rfxzbuocxersgbshczbj.supabase.co; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
<title>Set up BrewPOS Cloud account · Azurate</title>
<link rel="stylesheet" href="owner.css"><script src="account-setup.js" defer></script></head>
<body><main class="auth-form-area" style="min-height:100vh">
<div class="auth-mobile-logo" style="display:block">☕ BrewPOS / Azurate</div>
<form class="auth-card" id="setupForm" hidden>
  <div class="tag">SECURE CUSTOMER INVITATION</div>
  <h1>Set your password.</h1>
  <p>Your BrewPOS account was invited by Azurate. Set a unique password before signing in on your Android tablet.</p>
  <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
  <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
  <button class="primary full" type="submit" id="savePassword">Activate account</button>
</form>
<div class="auth-card" id="setupNotice">
<h1>Checking invitation…</h1><p id="message" role="status" aria-live="polite">Checking your account setup link.</p>
<a class="back-link" href="./">← BrewPOS website</a>
</div></main></body></html>
